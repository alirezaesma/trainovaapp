<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>۴۰۴ — صفحه یافت نشد | Trainova</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"/>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', system-ui, -apple-system, Tahoma, sans-serif;
      background:
        radial-gradient(1200px 600px at 100% -10%, rgba(255,107,53,0.15), transparent 60%),
        radial-gradient(1000px 500px at 0% 110%, rgba(220,38,38,0.10), transparent 55%),
        #08080a;
      color: #eff2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .container {
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    .logo-mark {
      width: 80px; height: 80px;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, #ff6b35, #dc2626);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; color: #001821; font-size: 40px;
      box-shadow: 0 12px 40px -10px rgba(255,107,53,0.5);
      animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    h1 {
      font-size: 72px;
      font-weight: 900;
      margin: 0 0 8px;
      background: linear-gradient(135deg, #ff6b35, #fb923c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    h2 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 16px;
      color: #f1f5f9;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.8;
      margin: 0 0 32px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff6b35, #dc2626);
      color: #001821;
      box-shadow: 0 8px 20px -6px rgba(255,107,53,0.5);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -6px rgba(255,107,53,0.6);
      opacity: 0.95;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #eff2f5;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.25);
    }
    .illustration {
      margin: 32px 0;
      opacity: 0.6;
    }
    .illustration svg {
      width: 100%;
      max-width: 280px;
      height: auto;
    }
    .features {
      margin-top: 40px;
      padding-top: 32px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      color: #cbd5e1;
      font-size: 14px;
    }
    .feature-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(255,107,53,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    @media (max-width: 480px) {
      h1 { font-size: 56px; }
      h2 { font-size: 20px; }
      .logo-mark { width: 60px; height: 60px; font-size: 30px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-mark">T</div>
    
    <h1>۴۰۴</h1>
    <h2>صفحه مورد نظر یافت نشد</h2>
    <p>
      متأسفیم! صفحه‌ای که جستجو می‌کنید وجود ندارد یا حذف شده است.<br/>
      می‌توانید به صفحه اصلی بازگردید یا از امکانات زیر استفاده کنید.
    </p>

    <div class="illustration">
      <svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="200" cy="150" r="120" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-dasharray="8 8"/>
        <path d="M140 150 L180 190 L260 110" stroke="rgba(255,107,53,0.4)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="200" cy="150" r="60" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
        <circle cx="200" cy="150" r="8" fill="rgba(255,107,53,0.6)"/>
      </svg>
    </div>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        <span>🏠</span>
        بازگشت به صفحه اصلی
      </a>
      <a href="/clear.html" class="btn btn-secondary">
        <span>🧹</span>
        پاک‌سازی کش
      </a>
    </div>

    <div class="features">
      <div class="feature-item">
        <div class="feature-icon">💪</div>
        <div>برنامه‌ریزی هوشمند تمرین</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">⏱️</div>
        <div>تایمرهای شناور حرفه‌ای</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">📅</div>
        <div>تقویم جلالی شمسی</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">🤖</div>
        <div>مربی صوتی هوش مصنوعی</div>
      </div>
    </div>
  </div>

  <script>
    // Track 404 errors (optional analytics)
    console.log('[Trainova 404] Page not found:', window.location.pathname);
  </script>
</body>
</html>
