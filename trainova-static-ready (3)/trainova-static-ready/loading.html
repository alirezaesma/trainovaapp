<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#08080a"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>در حال بارگذاری... | Trainova</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"/>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', system-ui, -apple-system, Tahoma, sans-serif;
      background:
        radial-gradient(1200px 600px at 100% -10%, rgba(255,107,53,0.15), transparent 60%),
        radial-gradient(1000px 500px at 0% 110%, rgba(220,38,38,0.10), transparent 55%),
        #08080a;
      color: #eff2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow: hidden;
    }
    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .logo-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
    }
    .logo-ring {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      border: 3px solid transparent;
      border-top-color: #ff6b35;
      border-right-color: #dc2626;
      animation: spin 1.2s linear infinite;
    }
    .logo-ring::before {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 22px;
      border: 3px solid transparent;
      border-bottom-color: #fb923c;
      border-left-color: #ff6b35;
      animation: spin-reverse 1.6s linear infinite;
    }
    .logo-mark {
      position: absolute;
      inset: 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff6b35, #dc2626);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #001821;
      font-size: 48px;
      box-shadow: 0 12px 40px -10px rgba(255,107,53,0.5);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      to { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.95; }
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 12px;
      color: #f1f5f9;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.8;
      margin: 0 0 24px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      overflow: hidden;
      margin: 24px 0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff6b35, #dc2626);
      border-radius: 10px;
      animation: progress 2s ease-in-out infinite;
    }
    @keyframes progress {
      0% { width: 0%; opacity: 1; }
      50% { width: 70%; opacity: 0.8; }
      100% { width: 100%; opacity: 0.5; }
    }
    .loading-dots {
      display: inline-flex;
      gap: 4px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff6b35;
      animation: dot-bounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
    .tips {
      margin-top: 32px;
      padding: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
    }
    .tip-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      color: #cbd5e1;
      font-size: 13px;
    }
    .tip-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255,107,53,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .skip-link {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .skip-link:hover {
      color: #ff6b35;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <div class="logo-ring"></div>
      <div class="logo-mark">T</div>
    </div>
    
    <h1>در حال بارگذاری<span class="loading-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></h1>
    <p>Trainova در حال آماده‌سازی تجربه تمرینی شماست...</p>
    
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    
    <div class="tips">
      <div class="tip-item">
        <div class="tip-icon">⚡</div>
        <div>بارگذاری هوشمند منابع</div>
      </div>
      <div class="tip-item">
        <div class="tip-icon">🔒</div>
        <div>بررسی امنیت اتصال</div>
      </div>
      <div class="tip-item">
        <div class="tip-icon">💾</div>
        <div>بهینه‌سازی کش مرورگر</div>
      </div>
    </div>
    
    <a href="/?force-load=1" class="skip-link">عبور از صفحه بارگذاری →</a>
  </div>

  <script>
    // Auto redirect after 3 seconds
    setTimeout(function() {
      window.location.replace('/?loaded=' + Date.now());
    }, 3000);
    
    console.log('[Trainova Loading] Page loaded');
  </script>
</body>
</html>
